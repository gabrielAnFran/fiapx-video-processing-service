apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-processing-service-secret
  labels:
    app.kubernetes.io/name: processing-service
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  PROCESSING_DB_DSN: {{ .Values.secret.dbDSN | quote }}
  PROCESSING_AMQP_URL: {{ .Values.secret.amqpURL | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secret.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secret.minioSecretKey | quote }}
